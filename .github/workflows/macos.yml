name: macOS

# The port to macOS is in progress, so this workflow runs only for the branch
# of that port, and by hand (Actions -> macOS -> Run workflow). GitHub shows
# the button only for a workflow that is on the default branch. The workflow
# joins the push and pull_request triggers of ci.yml when every suite passes
# here.
on:
  push:
    branches:
      - adding-support-for-unix-platforms
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (Apple clang${{ matrix.mode == 'asan' && ', ASan + UBSan' || '' }})
    strategy:
      # One job that fails must not cancel the others: each run must give as
      # many failures as it can.
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        mode: [plain, asan]
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          # AddressSanitizer and UndefinedBehaviorSanitizer, as the Linux
          # sanitizer job builds them. LeakSanitizer is not part of it: Apple
          # clang does not support it on arm64, and leaks(1) checks for
          # leaks instead.
          - mode: asan
            extra_cflags: -fsanitize=address,undefined -fno-sanitize-recover=undefined
    runs-on: ${{ matrix.runner }}
    env:
      EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
    # A test that hangs has no bound inside the process on macOS, because a
    # bounded join needs pthread_timedjoin_np(), which macOS does not have.
    # This timeout bounds such a hang; a sanitizer build runs slower.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # The build needs GNU make 4; macOS ships GNU make 3.81 as make, and
        # Homebrew installs a current one as gmake. OpenSSL comes from
        # Homebrew, outside the paths that clang searches by default, so
        # CPATH and LIBRARY_PATH give clang its headers and its libraries.
        # zlib is part of the macOS SDK.
        run: |
          brew install make openssl@3 coreutils
          ssl="$(brew --prefix openssl@3)"
          echo "CPATH=$ssl/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$ssl/lib" >> "$GITHUB_ENV"
          # The tests make certificates with the openssl command. The one in
          # /usr/bin is LibreSSL; this puts the OpenSSL that the library
          # links first in PATH for every later step.
          echo "$ssl/bin" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: |
          sw_vers
          uname -m
          cc --version
          gmake --version | head -1
          command -v openssl && openssl version
      - name: Probe what leaks(1) reports
        # memtest has no valgrind on macOS, and leaks --atExit is what can
        # take its place. Its documented exit status says only whether it
        # found a leak, so this shows, in a program that uses no library
        # code, what it reports for a clean exit, a leak, an exit status
        # that is not 0 (with and without a leak), and a leak in a forked
        # child, before memtest relies on any of it.
        # Each leaks call has a bound of its own, so a case that never
        # returns prints "timed out" and the next case still runs.
        if: matrix.mode == 'plain'
        timeout-minutes: 10
        run: |
          mkdir -p leakprobe && cd leakprobe
          cat > leakprobe.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/wait.h>
          #include <unistd.h>
          static void *volatile keep;
          static __attribute__((noinline)) void lose(void) {
            char *p = malloc(96);
            memset(p, 1, 96);
            keep = p;
            keep = NULL;
          }
          int main(int argc, char **argv) {
            const char *m = argc > 1 ? argv[1] : "clean";
            if (!strcmp(m, "leak") || !strcmp(m, "leakfail")) lose();
            if (!strcmp(m, "fork")) {
              pid_t c = fork();
              if (c == 0) {
                lose();
                _exit(0);
              }
              waitpid(c, NULL, 0);
            }
            printf("leakprobe %s done\n", m);
            return !strcmp(m, "fail") || !strcmp(m, "leakfail") ? 3 : 0;
          }
          EOF
          cc -O0 -g leakprobe.c -o leakprobe
          for m in clean leak fail leakfail fork; do
            echo "::group::leaks --atExit -- ./leakprobe $m"
            rc=0
            gtimeout -k 5s 60s leaks --atExit -- ./leakprobe "$m" \
              > "out_$m.txt" 2>&1 || rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "timed out after 60 s" >> "out_$m.txt"
            fi
            echo "rc=$rc" >> "out_$m.txt"
            cat "out_$m.txt"
            echo "::endgroup::"
          done
          for m in clean leak fail leakfail fork; do
            echo "$m: $(tail -1 "out_$m.txt") $(grep -E 'leaks for|exited|status' "out_$m.txt" | tr '\n' ' ')"
          done
      - name: Build the shared library
        run: gmake
      - name: Test every module
        # Every module runs, also after a module fails, so that one run shows
        # every failure. A plain `gmake test` stops at the first failing
        # module. gtimeout (coreutils) stops a module that hangs after 30
        # minutes, so one hang does not use the time of the whole job. macOS
        # gives a process 256 descriptors by default, and some suites open
        # more than 300 connections at once.
        run: |
          ulimit -n 4096
          failed=""
          for dir in tests/*/; do
            [ -f "$dir/Makefile" ] || continue
            m="$(basename "$dir")"
            echo "::group::$m"
            if ! gtimeout -k 30s 30m gmake -C "$dir" test; then
              failed="$failed $m"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed modules:$failed"
            exit 1
          fi
          echo "Every module passed."
