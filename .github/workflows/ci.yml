name: CI

on:
  push:
  pull_request:

# A push to a branch that also has an open pull request is built twice, once
# for each trigger. That is deliberate: pushing a branch with no pull request
# open is a normal way to get a full matrix run here, so the push trigger
# cannot be narrowed to main without losing it. Superseding runs on the same
# ref cancel their predecessor so the duplication costs queue time at most
# once per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-gcc:
    name: Linux x86_64 (GCC)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # abigail-tools supplies abidiff, which upgrades the ABI check from a
        # comparison of exported symbol names to one that also covers function
        # signatures and public struct layouts. It engages on its own once an
        # x86_64 corpus baseline exists under abi/; until then check_abi says
        # so on every run rather than passing silently.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev valgrind abigail-tools
      - name: make test
        run: make test
      - name: make memtest (valgrind)
        run: make memtest
      - name: public interface is fully namespaced
        run: make check_namespace
      # The exported ABI is a public contract in its own right, and one no test
      # suite can observe: every suite links the .c files directly, where a
      # symbol that the shared library fails to export resolves exactly as an
      # exported one does. Only a diff against the committed baseline in abi/
      # catches a symbol that vanished (breaking every linked application) or
      # one that escaped through a missing `static`.
      - name: exported ABI matches the committed baseline
        run: make check_abi
      # CCOL_MEMPOOL_COMPACT_LAYOUT selects a second entry layout, including a
      # different address-to-index derivation, behind about twenty conditional
      # sites. It is a builder-visible switch, so those sites ship; without this
      # step no build anywhere compiles them and the layout rots unnoticed. The
      # flag reaches the library sources and the suite's own translation unit
      # together, which is what the switch requires of any caller.
      - name: cmempool under the compact entry layout
        run: |
          set -eo pipefail
          make -C tests/cmempool clean
          make -C tests/cmempool EXTRA_CFLAGS="-DCCOL_MEMPOOL_COMPACT_LAYOUT=1" test
          make -C tests/cmempool clean
      # Built, not run. Benchmark timings on a shared, virtualized runner vary
      # more widely than most regressions worth catching, so there is no
      # threshold that is both stable and useful here; the baseline is recorded
      # per machine and compared locally instead. What CI is good for is making
      # sure the benchmarks still compile against the current API, since code
      # that is never built rots silently.
      - name: benchmarks build
        run: make -C bench && ./bench/bench --list

  linux-x86_64-clang:
    name: Linux x86_64 (Clang)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev valgrind
      - name: make test
        run: make CC=clang test
      - name: make memtest (valgrind)
        run: make CC=clang memtest

  linux-x86_64-minimal:
    name: Linux x86_64 (minimal build, no optional modules)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      # Deliberately installs neither libssl-dev nor zlib1g-dev. A build with
      # every optional module disabled must need neither, and the surest way to
      # keep that true is to build it where they are absent.
      - uses: actions/checkout@v4
      - name: make test (all optional modules off)
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0 test
      # The `test` target recurses into the per-module suites and never builds
      # the shared library, so the artifact the next step reads has to be built
      # here rather than assumed to exist.
      - name: build the minimal shared library
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0
      - name: confirm the library links nothing beyond pthread and libm
        # `pipefail` and resolving the versioned name through `ls` are both
        # load-bearing: a readelf failure inside a pipeline reports the exit
        # status of `awk` instead, which leaves `needed` empty and lets the
        # loop below pass without examining anything at all.
        run: |
          set -eo pipefail
          so=$(ls libccollections.so.1.*)
          needed=$(readelf -d "$so" | awk '/NEEDED/{print $NF}' | tr -d '[]')
          echo "$so needs: $needed"
          test -n "$needed"
          for lib in libssl libcrypto libz; do
            if echo "$needed" | grep -q "^$lib"; then
              echo "minimal build still links $lib" >&2
              exit 1
            fi
          done

  linux-x86_64-coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev lcov
      # Every file in src/ and include/ must reach the threshold that
      # ci_scripts/check_test_coverages.sh defines. Running that here rather than only in
      # coverage.yml is what keeps it useful: coverage.yml runs on a push to
      # main, so on its own it would only report a shortfall that has already
      # landed. Rebuilding every suite instrumented is the bulk of this job's
      # cost, and is still well inside what the rest of this matrix spends.
      - name: Build the merged coverage report
        run: make coverage_site
      - name: Check every file against the coverage threshold
        run: make coverage_check

  linux-x86_64-sanitizers:
    name: Linux x86_64 (ASan + UBSan)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev
      - name: make test (EXTRA_CFLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined)
        # ASan's shadow-memory instrumentation and valgrind's own
        # instrumentation are fundamentally incompatible, so this job never
        # runs `make memtest` on top of a sanitizer build.
        #
        # -fno-sanitize-recover=undefined: without it, UBSan reports a
        # detected UB to stderr and keeps running, so a real, live UB finding
        # here would not fail this job at all; the process still exits 0.
        run: make CC=clang EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" test

  linux-x86_64-tsan:
    name: Linux x86_64 (ThreadSanitizer)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: cpintable test_tsan
        run: cd tests/cpintable && make test_tsan
      - name: cmempool test_tsan
        run: cd tests/cmempool && make test_tsan
      - name: clrucache test_tsan
        run: cd tests/clrucache && make test_tsan
      - name: clogger test_tsan
        run: cd tests/clogger && make test_tsan
      - name: cthreadpool test_tsan
        run: cd tests/cthreadpool && make test_tsan
      - name: cthreadcomm test_tsan
        run: cd tests/cthreadcomm && make test_tsan
      - name: chttpclient test_tsan
        run: cd tests/chttpclient && make test_tsan
      - name: chttpserver test_tsan
        run: cd tests/chttpserver && make test_tsan
      - name: chttpserver test_engine_stop_tsan
        run: cd tests/chttpserver && make test_engine_stop_tsan

  linux-i386-gcc:
    name: Linux i386 (GCC, gcc -m32)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test
        # No `make memtest` leg here: valgrind cannot run a 32-bit process on
        # this runner without an additional 32-bit debuginfo package
        # (libc6-dbg:i386) that this job does not install.
        run: make CC="gcc -m32" test

  linux-i386-clang:
    name: Linux i386 (Clang, clang -m32)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # gcc-multilib is still required even though gcc is not the compiler
        # used here: clang -m32 relies on the same 32-bit crt objects/libgcc
        # that a native gcc installation's own multilib support provides
        # (found automatically under /usr/lib/gcc/x86_64-linux-gnu/<ver>/32/,
        # unlike the aarch64/arm32 Clang jobs' cross-compiled targets, this
        # needs no explicit -B: it is the same host gcc installation clang
        # already detects, just building for its 32-bit multilib variant).
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test
        # Same rationale as the i386 GCC job above for omitting `make
        # memtest`.
        run: make CC="clang -m32" test

  linux-i386-ubsan:
    name: Linux i386 (UBSan, gcc -m32 and clang -m32)
    runs-on: ubuntu-latest
    # No in-process mechanism bounds a hang here: a blocked queue receive or a
    # drain that never completes simply stops producing output, and this job's
    # own default ceiling is six hours. The suites this runs take about twenty
    # minutes of wall clock natively (make test plus make memtest), so this
    # leaves several times that as headroom for a slower hosted runner while
    # keeping a recurrence cheap rather than silent.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # No separate sanitizer package for the GCC leg: gcc-multilib pulls the
        # 32-bit UndefinedBehaviorSanitizer runtime in transitively, through
        # gcc-<ver>-multilib -> lib32gcc-<ver>-dev -> lib32ubsan1. The Clang leg
        # needs gcc-multilib too, for the same 32-bit crt objects and libgcc the
        # plain i386 Clang job relies on.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test (EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # Neither half of this combination reaches what the pair does. Whether
        # an expression is well defined can depend on the width of size_t (a
        # shift distance in range for 64 bits can exceed 32), and instrumenting
        # an operation is what makes a compiler reckon with an expression it
        # would otherwise fold away, so a defect can sit in the intersection and
        # be invisible to both the x86_64 sanitizer job and the plain i386 jobs.
        #
        # -fno-sanitize-recover=undefined: without it, UBSan reports a detected
        # problem to stderr and keeps running, so a real finding here would not
        # fail the job at all; the process still exits 0.
        #
        # Both compilers, as the two plain i386 jobs also cover both: their
        # UndefinedBehaviorSanitizer implementations do not check the same set
        # of things, so one can be clean where the other is not.
        #
        # No AddressSanitizer leg and no `make memtest`: 32-bit ASan wants an
        # address-space reservation this runner does not reliably allow, and
        # valgrind cannot run a 32-bit process here without libc6-dbg:i386,
        # which is why the two plain i386 jobs omit memtest as well.
        run: make CC="gcc -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test
      - name: make test (clang -m32, EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # The build-identity stamp the objects depend on covers the compiler and
        # its flags, so switching CC here rebuilds rather than relinking the
        # previous leg's objects.
        run: make CC="clang -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test

  linux-aarch64-gcc:
    name: Linux aarch64 (cross-compile + QEMU)
    runs-on: ubuntu-latest
    # qemu-user has a timing-dependent deadlock class around a guest fork():
    # a lock held inside the emulator at that instant is inherited locked by
    # the child, whose threads then sleep on a futex with nothing able to
    # release them. The one identified instance of it, linux-user's own
    # fd_trans_lock (gitlab.com/qemu-project/qemu/-/issues/2846), is fixed in
    # the qemu-user this job installs below. This bound covers whatever else
    # in that class remains: no in-process timeout can recover from it,
    # because the itimer this suite's own alarm() safety nets rely on is
    # stuck inside the same deadlock, and an occurrence ran for over 3 hours
    # with zero output before being cancelled. The bound keeps a recurrence
    # cheap instead of silently burning runner time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # arm64 is a ports architecture: its package indices live on
        # ports.ubuntu.com, not on the primary/security archive mirrors this
        # runner's default sources point at. Restrict the default sources to
        # amd64 (they carry no arm64 indices at all) and add a dedicated
        # arm64 source pointed at ports.ubuntu.com, or `apt-get update`
        # 404s trying to fetch nonexistent arm64 indices from the default
        # mirrors once arm64 is registered as a foreign architecture.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # Ubuntu 24.04 ships qemu-user 8.2.2, which carries a linux-user bug
        # that can leave its internal, process-wide fd_trans_lock permanently
        # locked in a forked child (gitlab.com/qemu-project/qemu/-/issues/2846).
        # Every thread of that child then sleeps on a futex forever, which
        # surfaces here as an unrelated-looking test hanging until its own
        # bounded wait gives up. The trigger is not something a guest program
        # can avoid by forking carefully: qemu-user runs more than one host
        # thread even while the emulated program is single-threaded, so any
        # guest fork() is exposed. Measured against this repository's own
        # cthreadcomm suite, 8.2.2 fails roughly one full-suite run in ten,
        # landing on a different fork() test each time, while 10.x passes.
        #
        # The static qemu-user binary is copied out of an official Debian
        # trixie image rather than installed from apt, because no Ubuntu 24.04
        # archive carries a fixed build. Nothing else about these jobs changes:
        # the binary is static-pie with no libc dependency, so it runs directly
        # on the runner, and the cross toolchain, sysroot and build flags stay
        # exactly as they were.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # The per-module test/memtest targets hardcode a bare `./tests`
        # invocation with no prefix-injection point, so an aarch64 binary
        # built via CC=aarch64-linux-gnu-gcc cannot simply be run through
        # `make test` on this x86_64 runner; it would try to execute an
        # ARM binary directly and fail immediately with "cannot execute
        # binary file". Each module is instead built via the existing
        # `build` target (unmodified) and its resulting `./tests` binary run
        # directly through qemu-aarch64. No `make memtest` (valgrind) leg:
        # running valgrind nested inside qemu-user emulation is not a
        # reliably supported combination.
        run: |
          set -e
          # Several suites fork a child that deliberately abort()s to prove a
          # misuse is fatal. qemu-user writes a guest core dump per abort into
          # the working directory, which these deliberate aborts give no reason
          # to keep and which runs to gigabytes across a full sweep, so the
          # limit is zeroed rather than left to whatever the runner defaults to.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # Build exactly what this module's own `test` target builds, and
            # run exactly the binaries its recipe runs, so this job covers the
            # same set as the native jobs. Most modules have one binary, but
            # chttpclient, chttpserver and cyaml each have several, and a
            # module that gains another later is picked up here with no edit
            # to this workflow. Deriving both lists from the Makefile keeps
            # that in step automatically; cyaml's build_differential is
            # correctly left out, since it is deliberately not a `test`
            # prerequisite.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists are derived by matching this module's own Makefile, so a
            # recipe that changes shape yields an empty list, the loop below
            # iterates zero times, and the module is built but never run, with
            # nothing non-zero for `set -e` to see. Assert they are non-empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC=aarch64-linux-gnu-gcc $targets)
            # Run from inside the module directory, exactly as its own
            # `test` target does: at least one binary (cyaml's
            # tests_spec_suite) resolves its vendored data files relative
            # to its own directory and fails outright from anywhere else.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

  linux-aarch64-clang:
    name: Linux aarch64 (Clang cross-compile + QEMU)
    runs-on: ubuntu-latest
    # See linux-aarch64-gcc's own comment above for the full rationale: this
    # job runs the identical fork() tests under the same emulator, so it
    # carries the identical residual deadlock risk.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # Same arm64-ports setup as the aarch64 GCC job above (see its own
        # comment for why); additionally installs clang itself, and keeps
        # gcc-aarch64-linux-gnu even though it is not the compiler used here,
        # since clang has no crt objects/libgcc of its own for this target
        # and needs gcc-aarch64-linux-gnu's to link against.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # See linux-aarch64-gcc's own identical step above for the full
        # rationale.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # Same shape as the aarch64 GCC job above (bare ./tests invocation,
        # no memtest leg; see its own comment for the full rationale on
        # both). The one real difference is how CC cross-compiles:
        #
        # -B points clang at gcc-aarch64-linux-gnu's own crtbeginS.o/libgcc/
        # libgcc_s, which clang has no equivalent of on its own; the exact
        # path is discovered at run time (not hardcoded), since it names the
        # specific GCC version this runner's own gcc-aarch64-linux-gnu
        # package happens to ship, not a fixed version this workflow should
        # assume. An explicit --sysroot= is deliberately NOT passed:
        # Debian/Ubuntu's aarch64-linux-gnu-ld already has the correct
        # sysroot (/usr/aarch64-linux-gnu) built into it at package-build
        # time, and passing --sysroot= again on top of that double-prefixes
        # every path ld resolves and breaks the link (reproduced directly:
        # "cannot find /usr/aarch64-linux-gnu/lib/libc.so.6 inside
        # /usr/aarch64-linux-gnu" with --sysroot= present, gone once removed).
        run: |
          set -e
          AARCH64_GCC_CROSS_DIR=$(find /usr/lib/gcc-cross/aarch64-linux-gnu -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # See linux-aarch64-gcc's own identical line above for why.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # Build exactly what this module's own `test` target builds, and
            # run exactly the binaries its recipe runs, so this job covers the
            # same set as the native jobs. Most modules have one binary, but
            # chttpclient, chttpserver and cyaml each have several, and a
            # module that gains another later is picked up here with no edit
            # to this workflow. Deriving both lists from the Makefile keeps
            # that in step automatically; cyaml's build_differential is
            # correctly left out, since it is deliberately not a `test`
            # prerequisite.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists are derived by matching this module's own Makefile, so a
            # recipe that changes shape yields an empty list, the loop below
            # iterates zero times, and the module is built but never run, with
            # nothing non-zero for `set -e` to see. Assert they are non-empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC="clang --target=aarch64-linux-gnu -B$AARCH64_GCC_CROSS_DIR" $targets)
            # Run from inside the module directory, exactly as its own
            # `test` target does: at least one binary (cyaml's
            # tests_spec_suite) resolves its vendored data files relative
            # to its own directory and fails outright from anywhere else.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

  linux-arm32-gcc:
    name: Linux arm32 (cross-compile + QEMU)
    runs-on: ubuntu-latest
    # See linux-aarch64-gcc's own comment above for the full rationale: this
    # job runs the identical fork() tests under qemu-arm, so it carries the
    # identical residual deadlock risk.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # armhf is a ports architecture, exactly like arm64 above: its
        # package indices live on ports.ubuntu.com, not on the primary/
        # security archive mirrors this runner's default sources point at.
        # Restrict the default sources to amd64 and add a dedicated armhf
        # source pointed at ports.ubuntu.com, mirroring the aarch64 job's
        # own identical fix.
        run: |
          sudo dpkg --add-architecture armhf
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/armhf-ports.list > /dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libssl-dev:armhf zlib1g-dev:armhf
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # See linux-aarch64-gcc's own identical step above for the full
        # rationale.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-arm-static /out/qemu-arm-static
          '
          sudo install -m 0755 "$STAGE/qemu-arm-static" /usr/local/bin/qemu-arm-static
          sudo rm -rf "$STAGE"
          qemu-arm-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-arm
        # Same shape as the aarch64 job above: build each module via the
        # existing `build` target with CC=arm-linux-gnueabihf-gcc and run the
        # resulting ./tests binary directly through qemu-arm, since this
        # x86_64 runner cannot execute an armhf binary on its own. No `make
        # memtest` (valgrind) leg, for the same reason the aarch64 job has
        # none: valgrind nested inside qemu-user emulation is not a
        # reliably supported combination.
        run: |
          set -e
          # See linux-aarch64-gcc's own identical line above for why.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # Build exactly what this module's own `test` target builds, and
            # run exactly the binaries its recipe runs, so this job covers the
            # same set as the native jobs. Most modules have one binary, but
            # chttpclient, chttpserver and cyaml each have several, and a
            # module that gains another later is picked up here with no edit
            # to this workflow. Deriving both lists from the Makefile keeps
            # that in step automatically; cyaml's build_differential is
            # correctly left out, since it is deliberately not a `test`
            # prerequisite.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists are derived by matching this module's own Makefile, so a
            # recipe that changes shape yields an empty list, the loop below
            # iterates zero times, and the module is built but never run, with
            # nothing non-zero for `set -e` to see. Assert they are non-empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC=arm-linux-gnueabihf-gcc $targets)
            # Run from inside the module directory, exactly as its own
            # `test` target does: at least one binary (cyaml's
            # tests_spec_suite) resolves its vendored data files relative
            # to its own directory and fails outright from anywhere else.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-arm-static -L /usr/arm-linux-gnueabihf "./$bin")
            done
            echo "::endgroup::"
          done

  linux-arm32-clang:
    name: Linux arm32 (Clang cross-compile + QEMU)
    runs-on: ubuntu-latest
    # See linux-aarch64-gcc's own comment above for the full rationale: this
    # job runs the identical fork() tests under qemu-arm, so it carries the
    # identical residual deadlock risk.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # Same armhf-ports setup as the arm32 GCC job above (see its own
        # comment for why); additionally installs clang itself, and keeps
        # gcc-arm-linux-gnueabihf even though it is not the compiler used
        # here, since clang has no crt objects/libgcc of its own for this
        # target and needs gcc-arm-linux-gnueabihf's to link against.
        run: |
          sudo dpkg --add-architecture armhf
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/armhf-ports.list > /dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y clang gcc-arm-linux-gnueabihf libssl-dev:armhf zlib1g-dev:armhf
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # See linux-aarch64-gcc's own identical step above for the full
        # rationale.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-arm-static /out/qemu-arm-static
          '
          sudo install -m 0755 "$STAGE/qemu-arm-static" /usr/local/bin/qemu-arm-static
          sudo rm -rf "$STAGE"
          qemu-arm-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-arm
        # Same shape as the arm32 GCC job above (bare ./tests invocation, no
        # memtest leg; see its own comment for the full rationale on both),
        # and the same cross-linking approach (-B, no explicit --sysroot=)
        # as the aarch64 Clang job above; see that job's own comment for the
        # full rationale (gcc-arm-linux-gnueabihf-ld has its own correct
        # sysroot built in, and passing --sysroot= again on top of that
        # double-prefixes every path ld resolves and breaks the link).
        #
        # EXTRA_CFLAGS="-Wno-error=unused-command-line-argument": Clang does
        # not implement -fstack-clash-protection's actual codegen for this
        # target at all (confirmed empirically: a binary built with the flag
        # is byte-identical to one built without it, on both clang-18 and
        # clang-19; GCC's own arm-linux-gnueabihf cross-compiler DOES
        # implement it, genuinely differing binaries, so linux-arm32-gcc
        # above still provides real protection for this architecture).
        # Whether Clang's driver actually WARNS about this is, separately,
        # its own genuine driver quirk: "argument unused during compilation"
        # fires only when the link step has no -l flag at all, so a
        # module's own LFLAGS being empty or not is what silently decided
        # whether -Werror caught it, not anything about the module's source.
        # Downgrading only this one, fully-understood diagnostic class from
        # fatal to a visible warning (never silencing it outright, e.g. via
        # a decoy -l flag) keeps the CI log honestly showing that this one
        # compiler/target combination cannot provide this specific hardening
        # flag, rather than hiding it.
        run: |
          set -e
          ARM_GCC_CROSS_DIR=$(find /usr/lib/gcc-cross/arm-linux-gnueabihf -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # See linux-aarch64-gcc's own identical line above for why.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # Build exactly what this module's own `test` target builds, and
            # run exactly the binaries its recipe runs, so this job covers the
            # same set as the native jobs. Most modules have one binary, but
            # chttpclient, chttpserver and cyaml each have several, and a
            # module that gains another later is picked up here with no edit
            # to this workflow. Deriving both lists from the Makefile keeps
            # that in step automatically; cyaml's build_differential is
            # correctly left out, since it is deliberately not a `test`
            # prerequisite.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists are derived by matching this module's own Makefile, so a
            # recipe that changes shape yields an empty list, the loop below
            # iterates zero times, and the module is built but never run, with
            # nothing non-zero for `set -e` to see. Assert they are non-empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC="clang --target=arm-linux-gnueabihf -B$ARM_GCC_CROSS_DIR" EXTRA_CFLAGS="-Wno-error=unused-command-line-argument" $targets)
            # Run from inside the module directory, exactly as its own
            # `test` target does: at least one binary (cyaml's
            # tests_spec_suite) resolves its vendored data files relative
            # to its own directory and fails outright from anywhere else.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-arm-static -L /usr/arm-linux-gnueabihf "./$bin")
            done
            echo "::endgroup::"
          done
