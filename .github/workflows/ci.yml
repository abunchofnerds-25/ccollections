        # run an s390x binary from CC=s390x-linux-gnu-gcc through `make test`:
        # the shell would try to run the s390x binary directly and fail at once
        # with "cannot execute binary file". So this job builds each module with
        # the existing `build` target, unchanged, and then runs the `./tests`
        # binary of that module through qemu-s390x. There's no `make memtest`
        # step with valgrind, because valgrind inside qemu-user emulation
        # doesn't work reliably.
        run: |
          set -e
          # Several suites fork a child that calls abort() on purpose, to prove
          # that a misuse stops the process, and qemu-user writes one guest core
          # dump for each abort into the working directory. A core dump of a
          # deliberate abort tells us nothing and over a full sweep they add up
          # to several gigabytes, so we set the limit to zero instead of keeping
          # the runner's default.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the module's `test` target builds and
            # runs exactly the binaries that its recipe runs, so this job covers
            # the same set as the native jobs. Most modules have one binary,
            # while chttpclient, chttpserver and cyaml have several. Both lists
            # come from the Makefile and follow it by themselves, so a module
            # that gets another binary later shows up here with no edit to this
            # workflow. The build_differential target of cyaml stays out, which
            # is right since it isn't a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from matching the module's Makefile, so a recipe
            # that changes shape gives an empty list. The loop below would then
            # run zero times and the job would build the module without ever
            # running it, with no non-zero status for `set -e` to see. These two
            # tests make sure that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC=s390x-linux-gnu-gcc $targets)
            # Run from inside the module directory, exactly as the module's
            # `test` target does, because at least one binary (tests_spec_suite
            # of cyaml) finds its data files relative to its own directory and
            # fails completely from any other directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && timeout -k 30 1200 qemu-s390x-static -L /usr/s390x-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

      # Struct layout belongs to one architecture, so no other job can stand in
      # for this one. The check reads the architecture from the ELF header of
      # the library and not from the runner (x86_64 here), so it picks the s390x
      # baseline for this cross-built library. Nothing runs under QEMU, because
      # reading an ELF file and its debug information is a static comparison.
      # The `test` targets of each module above never build the library itself,
      # so the prerequisite of check_abi is what builds it.
      - name: exported ABI matches the committed s390x baseline
        run: make CC=s390x-linux-gnu-gcc check_abi

  linux-aarch64-clang:
    name: Linux aarch64 (Clang cross-compile + QEMU)
    runs-on: ubuntu-latest
    # See the comment in the linux-aarch64-gcc job above for the full reason.
    # This job runs the same fork() tests under the same emulator, so it has
    # the same remaining risk of a deadlock.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # This is the same arm64 ports setup as in the aarch64 GCC job above
        # (see the comment there for why), plus clang itself. It keeps
        # gcc-aarch64-linux-gnu although gcc isn't the compiler here, because
        # clang has no crt objects and no libgcc of its own for this target and
        # links against the ones from gcc-aarch64-linux-gnu.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # See the same step in the linux-aarch64-gcc job above for the full
        # reason.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # This has the same shape as the aarch64 GCC job above, with a plain
        # ./tests command and no memtest step (see that job for the reason for
        # both). The one real difference is how CC cross-compiles.
        #
        # -B points clang at the crtbeginS.o, libgcc and libgcc_s of
        # gcc-aarch64-linux-gnu, because clang has none of its own. The job
        # finds the exact path at run time instead of hard-coding one, because
        # the path names the GCC version that the gcc-aarch64-linux-gnu package
        # of this runner ships, and this workflow must not assume a version. It
        # does NOT pass an explicit --sysroot=, on purpose: the
        # aarch64-linux-gnu-ld of Debian and Ubuntu already holds the correct
        # sysroot, /usr/aarch64-linux-gnu, from the time the package was built,
        # and a --sysroot= on top of that puts the prefix in front of every path
        # that ld resolves a second time, so the link fails. With --sysroot=
        # present, ld reports "cannot find /usr/aarch64-linux-gnu/lib/libc.so.6
        # inside /usr/aarch64-linux-gnu"; without the flag the error goes away.
        run: |
          set -e
          AARCH64_GCC_CROSS_DIR=$(find /usr/lib/gcc-cross/aarch64-linux-gnu -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # See the same line in the linux-aarch64-gcc job above for the
          # reason.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the module's `test` target builds and
            # runs exactly the binaries that its recipe runs, so this job covers
            # the same set as the native jobs. Most modules have one binary,
            # while chttpclient, chttpserver and cyaml have several. Both lists
            # come from the Makefile and follow it by themselves, so a module
            # that gets another binary later shows up here with no edit to this
            # workflow. The build_differential target of cyaml stays out, which
            # is right since it isn't a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from matching the module's Makefile, so a recipe
            # that changes shape gives an empty list. The loop below would then
            # run zero times and the job would build the module without ever
            # running it, with no non-zero status for `set -e` to see. These two
            # tests make sure that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC="clang --target=aarch64-linux-gnu -B$AARCH64_GCC_CROSS_DIR" $targets)
            # Run from inside the module directory, exactly as the module's
            # `test` target does, because at least one binary (tests_spec_suite
            # of cyaml) finds its data files relative to its own directory and
            # fails completely from any other directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && timeout -k 30 1200 qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

