  linux-x86_64-tsan-macos-paths:
    name: Linux x86_64 (ThreadSanitizer, Clang, macOS code paths)
    runs-on: ubuntu-latest
    # The macOS build compiles its own timed locks, a condition variable that
    # waits on a relative time, a pipe semaphore, per-thread state on the heap
    # and the close-on-exec gate, and neither ThreadSanitizer job above compiles
    # any of it. This job runs the same targets with every
    # _CCOL_EMULATE_DARWIN_* switch that Linux runs, built with Clang, which
    # also sees a race on a struct copy. The macOS workflow runs the same
