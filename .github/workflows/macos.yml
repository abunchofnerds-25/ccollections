name: macOS

# The port to macOS is in progress, so this workflow runs only for the branch
# of that port, and by hand (Actions -> macOS -> Run workflow). GitHub shows
# the button only for a workflow that is on the default branch. The workflow
# joins the push and pull_request triggers of ci.yml when every suite passes
# here.
on:
  push:
    branches:
      - adding-support-for-unix-platforms
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }} (Apple clang)
    strategy:
      # One architecture that fails must not cancel the other: each run
      # must give as many failures as it can.
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # A test that hangs has no bound inside the process on macOS, because a
    # bounded join needs pthread_timedjoin_np(), which macOS does not have.
    # This timeout bounds such a hang.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # The build needs GNU make 4; macOS ships GNU make 3.81 as make, and
        # Homebrew installs a current one as gmake. OpenSSL comes from
        # Homebrew, outside the paths that clang searches by default, so
        # CPATH and LIBRARY_PATH give clang its headers and its libraries.
        # zlib is part of the macOS SDK.
        run: |
          brew install make openssl@3 coreutils
          ssl="$(brew --prefix openssl@3)"
          echo "CPATH=$ssl/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$ssl/lib" >> "$GITHUB_ENV"
      - name: Show the toolchain
        run: |
          sw_vers
          uname -m
          cc --version
          gmake --version | head -1
      - name: Probe the precision of timed waits
        # A test of the HTTP client waits 20 ms on a condition variable and
        # allows 80 ms in total. On one arm64 run it took 95 ms. This prints
        # how late a 20 ms wait wakes on this runner, in a program that uses
        # no library code, so a late timer can be told from a deadline that
        # the library does not keep.
        run: |
          cat > probe.c <<'EOF'
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          static long long now_us(void) {
            struct timespec t;
            clock_gettime(CLOCK_MONOTONIC, &t);
            return (long long)t.tv_sec * 1000000 + t.tv_nsec / 1000;
          }
          static int cmp(const void *a, const void *b) {
            long long x = *(const long long *)a, y = *(const long long *)b;
            return (x > y) - (x < y);
          }
          static void report(const char *what, long long *late, int n) {
            qsort(late, n, sizeof(late[0]), cmp);
            printf("%s: late by min %lld us, median %lld us, p90 %lld us, "
                   "max %lld us\n", what, late[0], late[n / 2],
                   late[n * 9 / 10], late[n - 1]);
          }
          int main(void) {
            enum { N = 100 };
            long long late[N];
            pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
            pthread_cond_t c = PTHREAD_COND_INITIALIZER;
            struct timespec rel = {0, 20000000};
            pthread_mutex_lock(&m);
            for (int i = 0; i < N; i++) {
              long long t0 = now_us();
              pthread_cond_timedwait_relative_np(&c, &m, &rel);
              late[i] = now_us() - t0 - 20000;
            }
            pthread_mutex_unlock(&m);
            report("cond_timedwait_relative_np 20 ms", late, N);
            for (int i = 0; i < N; i++) {
              long long t0 = now_us();
              nanosleep(&rel, NULL);
              late[i] = now_us() - t0 - 20000;
            }
            report("nanosleep 20 ms", late, N);
            return 0;
          }
          EOF
          cc -O1 probe.c -o probe && ./probe
      - name: Build the shared library
        run: gmake
      - name: Test every module
        # Every module runs, also after a module fails, so that one run shows
        # every failure. A plain `gmake test` stops at the first failing
        # module. gtimeout (coreutils) stops a module that hangs after 30
        # minutes, so one hang does not use the time of the whole job. macOS
        # gives a process 256 descriptors by default, and some suites open
        # more than 300 connections at once.
        run: |
          ulimit -n 4096
          failed=""
          for dir in tests/*/; do
            [ -f "$dir/Makefile" ] || continue
            m="$(basename "$dir")"
            echo "::group::$m"
            if ! gtimeout -k 30s 30m gmake -C "$dir" test; then
              failed="$failed $m"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed modules:$failed"
            exit 1
          fi
          echo "Every module passed."
