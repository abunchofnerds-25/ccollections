name: CI

on:
  push:
  pull_request:

# A push to a branch that also has an open pull request starts two builds, one
# for each trigger, and that's on purpose: pushing to a branch with no open pull
# request is a normal way to get a full matrix run here, so the push trigger
# can't be limited to main. A newer run on the same ref cancels the one before
# it, so the second build costs queue time only once per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The root Makefile runs each module of `make test` and `make memtest` under
# timeout(1) for this many seconds when SUITE_TIMEOUT is set, so a hang fails
# its own module and names it, instead of using up the whole job timeout.
env:
  SUITE_TIMEOUT: 1800

jobs:
  linux-x86_64-gcc:
    name: Linux x86_64 (GCC)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # abigail-tools gives us abidiff, so the ABI check compares more than
        # the names of the exported symbols: it also covers the function
        # signatures and the layouts of the public structs. That layer reads the
        # corpus baseline under abi/ for the architecture of the library that
        # the job built, and the check takes that architecture from the ELF
        # header of the library. Without this package check_abi reports that it
        # didn't check signatures and layouts, so it never passes in silence.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev valgrind abigail-tools mandoc python3
      - name: make test
        run: make test
      - name: make memtest (valgrind)
        run: make memtest
      - name: public interface is fully namespaced
        run: make check_namespace
      # The typed container macros need -std=gnu11 because they use statement
      # expressions, but just INCLUDING a header must not need it, otherwise a
      # consumer's own header that includes one of ours would force gnu11 on
      # everything downstream of it. chttpclient.h expands chmap_declare()
      # inside a public struct, so it's the header where this breaks first. The
      # check adds -pedantic-errors, and it also compiles each header from the
      # installed layout behind an application directory that shadows every
      # other public name, which proves that a header finds its own siblings.
      - name: every installed header compiles standalone under strict -std=c11 -pedantic-errors
        run: make check_headers
      # The exported ABI is a public contract of its own and no test suite can
      # see it, because every suite links the .c files directly and there a
      # symbol that the shared library doesn't export resolves just like an
      # exported one. Only a diff against the committed baseline in abi/ finds a
      # symbol that disappeared (which breaks every linked application), and
      # only that diff finds a symbol that escaped through a missing `static`.
      - name: exported ABI matches the committed baseline
        run: make check_abi
      # `make install` and `make uninstall` build their argument lists from the
      # basenames under include/ and man/. A name that holds a shell
      # pathname-expansion character stops naming one file of this project and
      # starts naming a pattern that matches inside the INSTALLATION directory,
      # where `rm -f` would delete and `sed -i` would rewrite the files of other
      # packages. The recipes run under `set -f`, and this gate is the other
      # half that keeps such a name out of the tree.
      - name: every installable filename is a literal path
        run: make check_filenames
      # The guides link to the HTML man pages of the Pages site, and GitHub
      # can't check an absolute link, so this does: every one must name a page
      # under man/, and none may point at a troff source. Rendering the pages
      # here too means a page that mandoc reports an error in, such as a text
      # line that `man` silently drops, fails the pull request and not the
      # deployment after the merge.
      - name: every documentation link reaches a rendered man page
        run: make check_doc_links
      - name: every man page renders without a mandoc error
        run: make man_html
      # pthread_atfork() handlers live in the process-global state of the C
      # library and POSIX has no way to take them back, so a module that
      # registers them from a shared object that you later dlclose() would make
      # the next fork() in that process call into an address that isn't mapped.
      # glibc takes those handlers back for each object it unloads, and that's
      # what makes this library safe to unload. This step proves it on the built
      # artifact instead of assuming it. No test suite can, because each suite
      # links the .c files directly and never loads a .so.
      - name: fork() still works after the library is dlclose()d
        run: make check_dso_unload
      # Every destructor of the shared object runs at exit, whatever part of the
      # library a program used. This step links a program that uses almost
      # nothing of the library against the built .so, and fails when valgrind
      # finds memory of the library that is allocated at exit. No suite can see
      # this, because each suite links the .c files directly and has its own
      # destructors.
      - name: nothing of the library is left allocated at exit
        run: make check_exit_reachable
      # The suites compile the sources into each test binary, so none of them
      # sees the install. This step installs into a temporary prefix, builds the
      # example of README.md with the flags of the installed ccollections.pc,
      # runs it against the shared library and against the archive, and then
      # uninstalls.
      - name: the library installs, and an application builds against it
        run: make check_install
      # CCOL_MEMPOOL_COMPACT_LAYOUT selects a second entry layout, with its own
      # way of deriving an index from an address, spread over about twenty
      # conditional sites. Any builder can turn the switch on, so those sites
      # ship, and without this step no build would compile them and that layout
      # would rot without anybody noticing. The flag reaches the library sources
      # and the suite's translation unit together, which is what the switch
      # needs from every caller.
      - name: cmempool under the compact entry layout
        run: |
          set -eo pipefail
          make -C tests/cmempool clean
          make -C tests/cmempool EXTRA_CFLAGS="-DCCOL_MEMPOOL_COMPACT_LAYOUT=1" test
          make -C tests/cmempool clean
      # CCOL_MEMPOOL_DYNAMIC_TLS selects the general thread-local storage model
      # instead of initial-exec for the per-thread fast paths of cmempool and of
      # the handle-resolve pin index. doc/platforms.md documents it as a
      # supported build for a process that dlopen()s this library when the
      # static thread-local block is full. Since the switch ships, it needs a
      # build that compiles and RUNS it, and the step also reads the switch back
      # from the artifact, because a flag that never got to the compiler shows
      # nothing in a green log.
      - name: thread-local fast paths under the general TLS model
        run: |
          set -eo pipefail
          make clean
          make EXTRA_CFLAGS="-DCCOL_MEMPOOL_DYNAMIC_TLS=1"
          so=$(ls libccollections.so.1.*)
          # initial-exec emits R_X86_64_TPOFF64; the general model does not.
          if readelf -Wr "$so" | grep -q TPOFF; then
            echo "CCOL_MEMPOOL_DYNAMIC_TLS did not reach the library" >&2
            exit 1
          fi
          for m in cmempool cpintable clogger clrucache cthreadpool; do
            make -C "tests/$m" clean
            make -C "tests/$m" EXTRA_CFLAGS="-DCCOL_MEMPOOL_DYNAMIC_TLS=1" test
            make -C "tests/$m" clean
          done
          make clean
      # CCOL_FORK_SAFETY_REQUIRED=0 removes every pthread_atfork() registration
      # of this library, together with the handle state that exists only for
      # those registrations. common.h and ccollections(7) document it as a
      # complete opt-out for an application that never forks, or that always
      # execs right after a fork. Since the switch ships, the full suite has to
      # build and run with it. The step also reads the switch from the artifact:
      # without the fork-safety code nothing in the library can refer to
      # pthread_atfork.
      - name: full suite with the fork-safety machinery compiled out
        run: |
          set -eo pipefail
          make clean
          make EXTRA_CFLAGS="-DCCOL_FORK_SAFETY_REQUIRED=0"
          so=$(ls libccollections.so.1.*)
          if objdump -R "$so" | grep -q pthread_atfork; then
            echo "CCOL_FORK_SAFETY_REQUIRED=0 did not reach the library" >&2
            exit 1
          fi
          make EXTRA_CFLAGS="-DCCOL_FORK_SAFETY_REQUIRED=0" test
          make clean
      # This step builds the benchmarks but doesn't run them. On a shared,
      # virtual runner a benchmark time moves more than most regressions worth
      # catching, so no threshold here would be both steady and useful, and each
      # machine records its own baseline and compares against it locally. What
      # CI is good at is proving that the benchmarks compile against the current
      # API, since code that nothing builds rots without anybody noticing.
      - name: benchmarks build
        run: make -C bench && ./bench/bench --list

  linux-x86_64-clang:
    name: Linux x86_64 (Clang)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev valgrind
      - name: make test
        run: make CC=clang test
      - name: make memtest (valgrind)
        run: make CC=clang memtest
      - name: public struct layouts match the LP64 record
        run: make check_layout

  freebsd-x86_64:
    name: FreeBSD 14 x86_64 (Clang and GCC)
    runs-on: ubuntu-latest
    # The FreeBSD guest boots inside the Linux runner, so this job pays for the
    # boot, for valgrind and for ThreadSanitizer in a VM, and the timeout leaves
    # room for all three.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: test suites under FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.5"
          usesh: true
          copyback: false
          # The base system has clang (as cc), OpenSSL and zlib. GNU make is
          # gmake, which the build needs because FreeBSD's own make is BSD make.
          # binutils gives the ABI gate GNU readelf and nm, which the base
          # system's elftoolchain tools can't replace, libabigail gives it abidw
          # and abidiff, and pkgconf gives check_install its pkg-config.
          prepare: |
            pkg install -y gmake gcc14 valgrind binutils libabigail pkgconf
          # Every suite runs with the base clang, with gcc14 and under valgrind
          # (platform.mk adds tests/valgrind_freebsd.supp to every valgrind run
          # on FreeBSD). `gmake clean` between the passes drops the objects of
          # the previous compiler.
          run: |
            set -eu
            # A deliberate abort in a forked test child writes a core file of
            # the whole test heap (up to about 260 MB) before the parent can
            # reap it, and on a busy runner that write can outlast the bound
            # the parent puts on the child.
            ulimit -c 0
            # Runs one target in every module with a time bound of 30 minutes
            # each (the slowest module takes a few minutes here), carries on
            # after a failing module and names the failures at the end. A plain
            # `gmake test` stops at the first failure, and a hang there used
            # the whole job timeout and printed nothing about where it was.
            run_suites() {
              target=$1; shift
              failed=""
              for d in tests/*/; do
                [ -f "$d/Makefile" ] || continue
                if ! timeout -k 30 1800 gmake -C "$d" "$target" "$@"; then
                  failed="$failed $(basename "$d")"
                fi
              done
              if [ -n "$failed" ]; then
                echo "Failed modules ($target${*:+ $*}):$failed"
                return 1
              fi
            }
            run_suites test
            gmake clean >/dev/null
            run_suites test CC=gcc14
            gmake clean >/dev/null
            run_suites memtest
            gmake
            gmake check_abi
            gmake check_layout
            gmake check_dso_unload
            gmake check_exit_reachable
            gmake check_install
            # ThreadSanitizer with clang, on every module that has a TSan
            # target. The guest runs under KVM, and the fast clock_gettime of
            # libc maps its kvmclock on first use; TSan deadlocks on that
            # mapping, so we switch to the slow path, which avoids it.
            # tests/tsan_freebsd.c and tests/test_sanitizer.h carry the rest of
            # what this runtime needs. Each module has its own time bound, so a
            # hang fails the step instead of eating the whole job timeout.
            sysctl kern.timecounter.fast_gettime=0
            for m in cpintable cmempool clrucache mixed clogger cthreadpool cthreadcomm ctls chttpclient chttpserver; do
              timeout 1200 gmake -C "tests/$m" test_tsan
            done
            sysctl kern.timecounter.fast_gettime=1

  openbsd-x86_64:
    name: OpenBSD 7.9 x86_64 (Clang and GCC)
    runs-on: ubuntu-latest
    # The OpenBSD guest boots inside the Linux runner like the FreeBSD one, and
    # every suite runs twice in it, so the timeout leaves room for both passes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: test suites under OpenBSD
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945 # v1.4.8
        with:
          release: "7.9"
          usesh: true
          copyback: false
          # The base system has clang (as cc), LibreSSL, zlib and pkg-config.
          # GNU make is gmake and GCC is egcc. OpenBSD has no valgrind and no
          # libabigail, so this job runs neither memtest nor the ABI gate, and
          # check_layout measures the layout of the public structs with the base
          # clang instead.
          prepare: |
            pkg_add -I gmake gcc
          # Every suite runs with the base clang and with egcc, and `gmake
          # clean` between the passes drops the objects of the previous
          # compiler. Some suites hold several hundred descriptors at once,
          # while root starts with a soft limit of 128 on OpenBSD.
          run: |
            set -eu
            ulimit -n 1024
            # A deliberate abort in a forked test child writes a core file of
            # the whole test heap (up to about 260 MB) before the parent can
            # reap it, and on a busy runner that write can outlast the bound
            # the parent puts on the child.
            ulimit -c 0
            # Runs one target in every module with a time bound of 30 minutes
            # each (the slowest module takes a few minutes here), carries on
            # after a failing module and names the failures at the end. A plain
            # `gmake test` stops at the first failure, and a hang there used
            # the whole job timeout and printed nothing about where it was.
            run_suites() {
              target=$1; shift
              failed=""
              for d in tests/*/; do
                [ -f "$d/Makefile" ] || continue
                if ! timeout -k 30 1800 gmake -C "$d" "$target" "$@"; then
                  failed="$failed $(basename "$d")"
                fi
              done
              if [ -n "$failed" ]; then
                echo "Failed modules ($target${*:+ $*}):$failed"
                return 1
              fi
            }
            run_suites test
            gmake clean >/dev/null
            run_suites test CC=egcc
            gmake clean >/dev/null
            gmake
            gmake check_layout
            gmake check_dso_unload
            gmake check_install

  linux-x86_64-musl:
    name: Linux x86_64 musl (Alpine 3.24, GCC and Clang)
    runs-on: ubuntu-latest
    # Alpine is the usual base image for containers, so this job runs the suites
    # on musl inside that image, as root. Every suite runs with GCC and with
    # Clang, and then once more under valgrind.
    container: alpine:3.24
    timeout-minutes: 120
    steps:
      # git goes first, otherwise actions/checkout downloads an archive of the
      # repository instead of cloning it.
      - name: Install dependencies
        run: apk add --no-cache build-base linux-headers openssl openssl-dev zlib-dev valgrind pkgconf clang lld git coreutils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: make test (GCC)
        run: make test
      - name: make test (Clang)
        run: make clean >/dev/null && make CC=clang test
      # Docker gives the container a descriptor limit near 2^30 and valgrind
      # refuses to start with it. cjson and cyaml are left out here: musl's
      # strtod() computes with x87 long double, which valgrind emulates in
      # 64-bit precision, so under valgrind strtod("3.14") gives
      # 3.1400000000003274 and their exact float tests fail. The glibc memtest
      # jobs cover both modules.
      - name: make memtest (valgrind)
        run: |
          set -e
          ulimit -n 4096
          make clean >/dev/null
          for d in tests/*/; do
            [ -f "$d/Makefile" ] || continue
            case "$d" in tests/cjson/|tests/cyaml/) continue ;; esac
            timeout -k 30 "$SUITE_TIMEOUT" make -C "$d" memtest || { echo "$d: memtest failed or ran past $SUITE_TIMEOUT s" >&2; exit 1; }
          done
      - name: unload and install checks
        run: make && make check_dso_unload && make check_install

  linux-x86_64-debian11:
    name: Linux x86_64 Debian 11 (GCC 10, Clang 11, OpenSSL 1.1.1)
    runs-on: ubuntu-latest
    # The oldest compilers and TLS library that we support: GCC 10, Clang 11 and
    # OpenSSL 1.1.1, as Debian 11 ships them. Every other Linux job builds with
    # a newer GCC and Clang and with OpenSSL 3, so without this job a call that
    # only OpenSSL 3 has, or a construct that only a newer compiler accepts,
    # would pass CI. Debian 11 has left the regular mirrors and
    # archive.debian.org lists packages that its pool doesn't hold, so apt reads
    # the snapshot.debian.org lines that the image itself carries (commented
    # out). They name the date the image was built, so they always match its
    # installed packages.
    container: debian:bullseye
    timeout-minutes: 120
    steps:
      # git goes first, otherwise actions/checkout downloads an archive of the
      # repository instead of cloning it.
      - name: Install dependencies
        run: |
          set -e
          sed -n 's/^# deb /deb [check-valid-until=no] /p' /etc/apt/sources.list > /tmp/sources.list
          test -s /tmp/sources.list
          mv /tmp/sources.list /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libssl-dev zlib1g-dev pkg-config locales git clang-11
          # The compile probes look for a command named clang and skip
          # without one.
          ln -s /usr/bin/clang-11 /usr/local/bin/clang
          gcc --version | head -n 1
          clang-11 --version | head -n 1
          openssl version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: make test
        run: make test
      # Clang 11 is the oldest Clang that we support. The clean drops the
      # objects and the saved configuration of the GCC build before it.
      - name: make test (Clang 11)
        run: make clean >/dev/null && make CC=clang-11 test
      # The clean puts the build back on the default compiler, so these
      # checks run against a GCC build.
      - name: unload and install checks
        run: make clean >/dev/null && make && make check_dso_unload && make check_install

  linux-x86_64-minimal:
    name: Linux x86_64 (minimal build, no optional modules)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      # This job installs neither libssl-dev nor zlib1g-dev, on purpose. A build
      # with every optional module turned off must need neither of them, and the
      # simplest way to keep that true is to make such a build on a machine that
      # doesn't have them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: make test (all optional modules off)
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0 test
      # The `test` target goes into the suite of each module and never builds
      # the shared library, so this step has to build the artifact that the next
      # step reads instead of assuming it's already there.
      - name: build the minimal shared library
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0
      - name: confirm the library links nothing beyond pthread and libm
        # Both `pipefail` and finding the versioned name with `ls` are needed.
        # Without them a readelf failure inside the pipeline gives you the exit
        # status of `awk` instead, `needed` stays empty, and the loop below
        # passes having examined nothing at all.
        run: |
          set -eo pipefail
          so=$(ls libccollections.so.1.*)
          needed=$(readelf -d "$so" | awk '/NEEDED/{print $NF}' | tr -d '[]')
          echo "$so needs: $needed"
          test -n "$needed"
          for lib in libssl libcrypto libz; do
            if echo "$needed" | grep -q "^$lib"; then
              echo "minimal build still links $lib" >&2
              exit 1
            fi
          done

  linux-x86_64-coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev lcov
      # Every file in src/ and include/ must reach the threshold that
      # ci_scripts/check_test_coverages.sh sets. We run that check here and not
      # only in coverage.yml, because coverage.yml runs on a push to main and on
      # its own would report a shortfall only once it's already in main.
      # Building every suite with instrumentation is most of the cost of this
      # job, but that cost is well below what the rest of this matrix spends.
      - name: Build the merged coverage report
        run: make coverage_site
      - name: Check every file against the coverage threshold
        run: make coverage_check

  linux-x86_64-sanitizers:
    name: Linux x86_64 (ASan + UBSan)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev
      - name: make test (EXTRA_CFLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined)
        # The shadow memory of AddressSanitizer and the instrumentation of
        # valgrind can't work together, so this job never runs `make memtest` on
        # a build with a sanitizer.
        #
        # -fno-sanitize-recover=undefined is needed: without it
        # UndefinedBehaviorSanitizer writes its report to stderr and carries on,
        # the process exits 0 all the same, and a real finding here wouldn't
        # fail this job.
        run: make CC=clang EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" test

  linux-x86_64-tsan:
    name: Linux x86_64 (ThreadSanitizer)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: cpintable test_tsan
        run: cd tests/cpintable && make test_tsan
        timeout-minutes: 45
      - name: cmempool test_tsan
        run: cd tests/cmempool && make test_tsan
        timeout-minutes: 45
      - name: clrucache test_tsan
        run: cd tests/clrucache && make test_tsan
        timeout-minutes: 45
      - name: mixed test_tsan (behavioural compatibility corpus)
        run: cd tests/mixed && make test_tsan
        timeout-minutes: 45
      - name: clogger test_tsan
