  linux-x86_64-tsan-clang:
    name: Linux x86_64 (ThreadSanitizer, Clang)
    runs-on: ubuntu-latest
    # The GCC ThreadSanitizer job above doesn't see a data race on a struct
    # assignment. GCC's instrumentation pass emits no __tsan_write for a struct
    # copy, so a race on a copied struct timespec or any other aggregate passes
    # it, while Clang instruments the same copy and reports the race. This job
    # runs the same targets built with Clang so that this class has a job that
    # can see it. The timeout follows the GCC job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
