        timeout-minutes: 45
      - name: clrucache test_tsan (Clang)
        run: cd tests/clrucache && make CC=clang test_tsan
        timeout-minutes: 45
      - name: mixed test_tsan (behavioural compatibility corpus) (Clang)
        run: cd tests/mixed && make CC=clang test_tsan
        timeout-minutes: 45
      - name: clogger test_tsan (Clang)
        run: cd tests/clogger && make CC=clang test_tsan
        timeout-minutes: 45
      - name: cthreadpool test_tsan (Clang)
