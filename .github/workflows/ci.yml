          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-arm-static /out/qemu-arm-static
          '
          sudo install -m 0755 "$STAGE/qemu-arm-static" /usr/local/bin/qemu-arm-static
          sudo rm -rf "$STAGE"
          qemu-arm-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-arm
        # This has the same shape as the arm32 GCC job above: a plain ./tests
        # command and no memtest step (see the comment in that job for the full
        # reason for both). It cross-links in the same way as the aarch64 Clang
        # job above, with -B and no explicit --sysroot= (see the comment in that
        # job for the full reason). In short, gcc-arm-linux-gnueabihf-ld already
        # holds its own correct sysroot, and a --sysroot= on top of that puts
        # the prefix in front of every path that ld resolves a second time, so
        # the link fails.
        #
        # clang generates no code for -fstack-clash-protection on this target: a
        # binary built with the flag is identical, byte for byte, to one built
        # without it, on both clang-18 and clang-19, and the driver then reports
        # "argument unused during compilation". The root Makefile and
        # tests/hardening.mk therefore PROBE each hardening flag and pass only
        # the ones that this compiler implements for this target, so this job
        # needs no -Wno-error of its own. Run `make hardening_report` to see
        # which flags survive for a given compiler and target.
        #
        # The arm-linux-gnueabihf cross compiler of GCC does generate that code,
        # and its binaries really do differ, so the linux-arm32-gcc job above
        # gives real protection on this architecture.
        run: |
          set -e
          ARM_GCC_CROSS_DIR=$(find /usr/lib/gcc-cross/arm-linux-gnueabihf -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # See the same line in the linux-aarch64-gcc job above for the
          # reason.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the `test` target of this module builds
            # and runs exactly the binaries that its recipe runs, so this job
            # covers the same set as the native jobs. Most modules have one
            # binary, while chttpclient, chttpserver and cyaml each have
            # several. A module that gets another binary later appears here with
            # no edit to this workflow, because both lists come from the
            # Makefile and stay in step with it automatically. The
            # build_differential target of cyaml stays out, which is correct,
            # because it is not a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from a match against the Makefile of this module,
            # so a recipe that changes shape gives an empty list. The loop below
            # then runs zero times, and the job builds the module but never runs
            # it, with no non-zero status for `set -e` to see; these two tests
            # prove that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC="clang --target=arm-linux-gnueabihf -B$ARM_GCC_CROSS_DIR" $targets)
            # This runs from inside the module directory, exactly as the `test`
            # target of that module does: at least one binary, tests_spec_suite
            # of cyaml, finds its data files relative to its own directory and
            # fails completely from any other directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-arm-static -L /usr/arm-linux-gnueabihf "./$bin")
            done
            echo "::endgroup::"
          done
