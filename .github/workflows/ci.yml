name: CI

on:
  push:
  pull_request:

# A push to a branch that also has an open pull request starts two builds, one
# for each trigger. This is on purpose. A push to a branch with no open pull
# request is a normal way to get a full matrix run here. The push trigger
# therefore cannot be limited to main, because that would lose this. A newer
# run on the same ref cancels the run before it, so the second build costs
# queue time one time only for each ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64-gcc:
    name: Linux x86_64 (GCC)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # abigail-tools gives you abidiff. With abidiff, the ABI check does
        # more than compare the names of the exported symbols. It also covers
        # the function signatures and the layouts of the public structs. That
        # layer reads the corpus baseline under abi/ for the architecture of
        # the library that the job built. The check takes that architecture
        # from the ELF header of the library. Without this package, check_abi
        # reports that it did not check signatures and layouts. It does not
        # pass in silence.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev valgrind abigail-tools
      - name: make test
        run: make test
      - name: make memtest (valgrind)
        run: make memtest
      - name: public interface is fully namespaced
        run: make check_namespace
      # The typed container macros need -std=gnu11, because they use statement
      # expressions. Merely INCLUDING a header must not: a consumer's own
      # header that includes one would otherwise force gnu11 on everything
      # downstream of it. chttpclient.h expands chmap_declare() inside a public
      # struct, so it is the header that this can regress on first. The check
      # adds -pedantic-errors, and it also compiles each header from the
      # installed layout behind an application directory that shadows every
      # other public name, which proves that a header finds its own siblings.
      - name: every installed header compiles standalone under strict -std=c11 -pedantic-errors
        run: make check_headers
      # The exported ABI is a public contract of its own, and no test suite can
      # see it. Every suite links the .c files directly. There, a symbol that
      # the shared library does not export resolves in the same way as an
      # exported one. Only a diff against the committed baseline in abi/ finds
      # a symbol that disappeared, which breaks every linked application. Only
      # that diff also finds a symbol that escaped through a missing `static`.
      - name: exported ABI matches the committed baseline
        run: make check_abi
      # `make install` and `make uninstall` build their argument lists from the
      # basenames under include/ and man/. A name that holds a shell
      # pathname-expansion character stops naming one file of this project and
      # starts naming a pattern that matches inside the INSTALLATION
      # directory, where `rm -f` would delete and `sed -i` would rewrite other
      # packages' files. The recipes run under `set -f`; this gate is the other
      # half, and it keeps such a name out of the tree.
      - name: every installable filename is a literal path
        run: make check_filenames
      # pthread_atfork() handlers live in the process-global state of the C
      # library, and POSIX gives no way to take them back. A module that
      # registers them from a shared object that you later dlclose() would
      # therefore make the next fork() in that process call into an address
      # that is not mapped. glibc takes those handlers back for each object
      # that it unloads. This is what makes this library safe to unload. This
      # step proves that on the built artifact and does not assume it. No test
      # suite can prove it, because each suite links the .c files directly and
      # never loads a .so.
      - name: fork() still works after the library is dlclose()d
        run: make check_dso_unload
      # Each destructor of the shared object runs at exit, whatever part of
      # the library a program used. This step links a program that uses
      # almost nothing of the library against the built .so. The step fails
      # when valgrind finds memory of the library that is allocated at exit.
      # No suite can see this, because each suite links the .c files
      # directly and has its own destructors.
      - name: nothing of the library is left allocated at exit
        run: make check_exit_reachable
      # CCOL_MEMPOOL_COMPACT_LAYOUT selects a second entry layout. That layout
      # includes a different way to derive an index from an address. About
      # twenty conditional sites hold it. Any builder can turn the switch on,
      # so those sites ship. Without this step, no build compiles them, and
      # that layout decays without notice. The flag reaches the library sources
      # and the translation unit of the suite together. The switch needs that
      # from every caller.
      - name: cmempool under the compact entry layout
        run: |
          set -eo pipefail
          make -C tests/cmempool clean
          make -C tests/cmempool EXTRA_CFLAGS="-DCCOL_MEMPOOL_COMPACT_LAYOUT=1" test
          make -C tests/cmempool clean
      # CCOL_MEMPOOL_DYNAMIC_TLS selects the general thread-local storage model
      # in place of initial-exec. It applies to the per-thread fast paths of
      # cmempool and of the handle-resolve pin index. doc/platforms.md
      # documents it as a supported build for a process that dlopen()s this
      # library when the static thread-local block is full. The switch ships.
      # Therefore, it needs a build that compiles and RUNS it. The step also
      # reads the switch from the artifact. A flag that did not get to the
      # compiler shows nothing in a green log.
      - name: thread-local fast paths under the general TLS model
        run: |
          set -eo pipefail
          make clean
          make EXTRA_CFLAGS="-DCCOL_MEMPOOL_DYNAMIC_TLS=1"
          so=$(ls libccollections.so.1.*)
          # initial-exec emits R_X86_64_TPOFF64. The general model does not.
          if readelf -Wr "$so" | grep -q TPOFF; then
            echo "CCOL_MEMPOOL_DYNAMIC_TLS did not reach the library" >&2
            exit 1
          fi
          for m in cmempool cpintable clogger clrucache cthreadpool; do
            make -C "tests/$m" clean
            make -C "tests/$m" EXTRA_CFLAGS="-DCCOL_MEMPOOL_DYNAMIC_TLS=1" test
            make -C "tests/$m" clean
          done
          make clean
      # CCOL_FORK_SAFETY_REQUIRED=0 removes each pthread_atfork() registration
      # of this library. It also removes the handle state that exists only for
      # those registrations. common.h and ccollections(7) document it as a
      # complete opt-out for an application that never forks, or that always
      # execs immediately after a fork. The switch ships. Therefore, the full
      # suite must build and run with it. The step also reads the switch from
      # the artifact. Without the fork-safety code, nothing in the library can
      # refer to pthread_atfork.
      - name: full suite with the fork-safety machinery compiled out
        run: |
          set -eo pipefail
          make clean
          make EXTRA_CFLAGS="-DCCOL_FORK_SAFETY_REQUIRED=0"
          so=$(ls libccollections.so.1.*)
          if objdump -R "$so" | grep -q pthread_atfork; then
            echo "CCOL_FORK_SAFETY_REQUIRED=0 did not reach the library" >&2
            exit 1
          fi
          make EXTRA_CFLAGS="-DCCOL_FORK_SAFETY_REQUIRED=0" test
          make clean
      # This step builds the benchmarks and does not run them. On a shared,
      # virtual runner, a benchmark time moves more than most regressions that
      # are worth catching. No threshold here is both steady and useful. Each
      # machine records its own baseline and compares against it locally. What
      # CI does well is prove that the benchmarks still compile against the
      # current API, because code that nothing builds decays without notice.
      - name: benchmarks build
        run: make -C bench && ./bench/bench --list

  linux-x86_64-clang:
    name: Linux x86_64 (Clang)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev valgrind
      - name: make test
        run: make CC=clang test
      - name: make memtest (valgrind)
        run: make CC=clang memtest

  freebsd-x86_64:
    name: FreeBSD 14 x86_64 (Clang and GCC)
    runs-on: ubuntu-latest
    # The FreeBSD guest boots inside the Linux runner, so this job pays for
    # the boot, for valgrind and for ThreadSanitizer in a VM; the timeout
    # leaves room for all three.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: test suites under FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.5"
          usesh: true
          copyback: false
          # The base system carries clang (as cc), OpenSSL and zlib. GNU make
          # is gmake, because the build needs it and FreeBSD's make is BSD
          # make.
          # binutils gives the ABI gate GNU readelf and nm, which the base
          # system's elftoolchain tools do not replace; libabigail gives it
          # abidw and abidiff.
          prepare: |
            pkg install -y gmake gcc14 valgrind binutils libabigail
          # Every suite runs: with the base clang, with gcc14, and under
          # valgrind (tests/valgrind_freebsd.supp joins every valgrind run on
          # FreeBSD through platform.mk). `gmake clean` between the passes
          # drops the objects of the previous compiler.
          run: |
            set -eu
            gmake test
            gmake clean >/dev/null
            gmake test CC=gcc14
            gmake clean >/dev/null
            gmake memtest
            gmake
            gmake check_abi
            gmake check_dso_unload
            gmake check_exit_reachable
            # ThreadSanitizer with clang, on every module that has a TSan
            # target. The guest runs under KVM, whose kvmclock the fast
            # clock_gettime of libc maps on first use, and TSan deadlocks on
            # that mapping; the slow path avoids it.
            # tests/tsan_freebsd.c and tests/test_sanitizer.h carry the rest
            # of what this runtime needs. Each module is bounded, so a hang
            # fails the step instead of the whole job timeout.
            sysctl kern.timecounter.fast_gettime=0
            for m in cpintable cmempool clrucache mixed clogger cthreadpool cthreadcomm ctls chttpclient chttpserver; do
              timeout 1200 gmake -C "tests/$m" test_tsan
            done
            sysctl kern.timecounter.fast_gettime=1

  linux-x86_64-minimal:
    name: Linux x86_64 (minimal build, no optional modules)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      # This job installs neither libssl-dev nor zlib1g-dev, on purpose. A build
      # with every optional module turned off must need neither of them. The
      # best way to keep that true is to make such a build on a machine that
      # does not have them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: make test (all optional modules off)
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0 test
      # The `test` target goes into the suite of each module and never builds
      # the shared library. This step must therefore build the artifact that
      # the next step reads. Do not assume that it is already there.
      - name: build the minimal shared library
        run: |
          make WITH_CJSON=0 WITH_CYAML=0 WITH_CLOGGER=0 \
               WITH_CHTTPCLIENT=0 WITH_CHTTPSERVER=0
      - name: confirm the library links nothing beyond pthread and libm
        # Both `pipefail` and the use of `ls` to find the versioned name are
        # necessary. A readelf failure inside a pipeline gives you the exit
        # status of `awk` instead. That leaves `needed` empty, and the loop
        # below then passes after it examined nothing at all.
        run: |
          set -eo pipefail
          so=$(ls libccollections.so.1.*)
          needed=$(readelf -d "$so" | awk '/NEEDED/{print $NF}' | tr -d '[]')
          echo "$so needs: $needed"
          test -n "$needed"
          for lib in libssl libcrypto libz; do
            if echo "$needed" | grep -q "^$lib"; then
              echo "minimal build still links $lib" >&2
              exit 1
            fi
          done

  linux-x86_64-coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev lcov
      # Every file in src/ and include/ must reach the threshold that
      # ci_scripts/check_test_coverages.sh sets. This step runs that check here
      # and not only in coverage.yml, which is what keeps the check useful.
      # coverage.yml runs on a push to main, so on its own it would report a
      # shortfall only after that shortfall is already in main. A build of
      # every suite with instrumentation is most of the cost of this job, and
      # it is still well below what the rest of this matrix spends.
      - name: Build the merged coverage report
        run: make coverage_site
      - name: Check every file against the coverage threshold
        run: make coverage_check

  linux-x86_64-sanitizers:
    name: Linux x86_64 (ASan + UBSan)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev
      - name: make test (EXTRA_CFLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined)
        # The shadow memory instrumentation of AddressSanitizer and the
        # instrumentation of valgrind cannot work together. This job therefore
        # never runs `make memtest` on a build with a sanitizer.
        #
        # -fno-sanitize-recover=undefined is necessary. Without it,
        # UndefinedBehaviorSanitizer writes a report to stderr and continues.
        # A real finding here would then not fail this job, because the
        # process still exits 0.
        run: make CC=clang EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined" test

  linux-x86_64-tsan:
    name: Linux x86_64 (ThreadSanitizer)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: cpintable test_tsan
        run: cd tests/cpintable && make test_tsan
      - name: cmempool test_tsan
        run: cd tests/cmempool && make test_tsan
      - name: clrucache test_tsan
        run: cd tests/clrucache && make test_tsan
      - name: mixed test_tsan (behavioural compatibility corpus)
        run: cd tests/mixed && make test_tsan
      - name: clogger test_tsan
        run: cd tests/clogger && make test_tsan
      - name: cthreadpool test_tsan
        run: cd tests/cthreadpool && make test_tsan
      - name: cthreadcomm test_tsan
        run: cd tests/cthreadcomm && make test_tsan
      - name: ctls test_tsan
        run: cd tests/ctls && make test_tsan
      - name: chttpclient test_tsan
        run: cd tests/chttpclient && make test_tsan
      - name: chttpserver test_tsan
        run: cd tests/chttpserver && make test_tsan
      - name: chttpserver test_engine_stop_tsan
        run: cd tests/chttpserver && make test_engine_stop_tsan

  linux-x86_64-tsan-clang:
    name: Linux x86_64 (ThreadSanitizer, Clang)
    runs-on: ubuntu-latest
    # The GCC ThreadSanitizer job above does not see a data race on a struct
    # assignment: GCC's instrumentation pass emits no __tsan_write for a struct
    # copy, so a race on a copied struct timespec or any other aggregate
    # passes it. Clang instruments the same copy and reports the race. This
    # job runs the same targets built with Clang, so that class has a job that
    # can see it. The timeout follows the GCC job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev
      - name: cpintable test_tsan (Clang)
        run: cd tests/cpintable && make CC=clang test_tsan
      - name: cmempool test_tsan (Clang)
        run: cd tests/cmempool && make CC=clang test_tsan
      - name: clrucache test_tsan (Clang)
        run: cd tests/clrucache && make CC=clang test_tsan
      - name: mixed test_tsan (behavioural compatibility corpus) (Clang)
        run: cd tests/mixed && make CC=clang test_tsan
      - name: clogger test_tsan (Clang)
        run: cd tests/clogger && make CC=clang test_tsan
      - name: cthreadpool test_tsan (Clang)
        run: cd tests/cthreadpool && make CC=clang test_tsan
      - name: cthreadcomm test_tsan (Clang)
        run: cd tests/cthreadcomm && make CC=clang test_tsan
      - name: ctls test_tsan (Clang)
        run: cd tests/ctls && make CC=clang test_tsan
      - name: chttpclient test_tsan (Clang)
        run: cd tests/chttpclient && make CC=clang test_tsan
      - name: chttpserver test_tsan (Clang)
        run: cd tests/chttpserver && make CC=clang test_tsan
      - name: chttpserver test_engine_stop_tsan (Clang)
        run: cd tests/chttpserver && make CC=clang test_engine_stop_tsan

  linux-x86_64-memtest-macos-paths:
    name: Linux x86_64 (memtest, macOS code paths)
    runs-on: ubuntu-latest
    # macOS has no valgrind, and leaks(1) there drops the exit status of the
    # test and hangs on a program that forks. The code that only macOS
    # compiles sits behind the _CCOL_EMULATE_DARWIN_* switches, and this job
    # turns them on, so valgrind checks those paths for leaks and memory
    # errors on every push: the condition variable, timed locks and semaphore
    # of common.h (SYNC), the socket setup and the bounded send of csock.h
    # (SOCK), the portable memrchr (MEMRCHR), and the per-thread state that a
    # key owns (TLS). The kqueue wake descriptor (WAKEFD) needs kqueue, so
    # only FreeBSD can run it. The suites take about as long as the memtest
    # of the GCC job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev valgrind
      - name: make memtest with every macOS switch
        run: >-
          make memtest EXTRA_CFLAGS="-D_CCOL_EMULATE_DARWIN_SYNC=1
          -D_CCOL_EMULATE_DARWIN_SOCK=1 -D_CCOL_EMULATE_DARWIN_MEMRCHR=1
          -D_CCOL_EMULATE_DARWIN_TLS=1"

  linux-i386-gcc:
    name: Linux i386 (GCC, gcc -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386 zlib1g-dev:i386 abigail-tools
      - name: make test
        # This job has no `make memtest` step. valgrind cannot run a 32-bit
        # process on this runner without one more 32-bit debug information
        # package, libc6-dbg:i386, and this job does not install it.
        run: make CC="gcc -m32" test
      # Struct layout belongs to one architecture, so the x86_64 job cannot
      # replace this one. For example, a member that goes from size_t to
      # unsigned long long changes nothing on LP64, and moves every later field
      # on ILP32. The check reads the architecture out of the ELF header of the
      # library, so it takes the i386 baseline even though the runner is
      # x86_64. The `test` target goes into the suite directories and never
      # builds the library itself. The prerequisite of check_abi is what builds
      # it here.
      - name: exported ABI matches the committed i386 baseline
        run: make CC="gcc -m32" check_abi

  linux-i386-clang:
    name: Linux i386 (Clang, clang -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # This job still needs gcc-multilib, although gcc is not the compiler
        # here. clang -m32 uses the same 32-bit crt objects and libgcc that the
        # multilib support of a native gcc installation gives. clang finds them
        # automatically under /usr/lib/gcc/x86_64-linux-gnu/<ver>/32/. This job
        # therefore needs no -B flag, and the aarch64 and arm32 Clang jobs do,
        # because their targets are cross-compiled. Here clang already detects
        # the same host gcc installation, and only builds for its 32-bit
        # multilib form.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test
        # This job leaves out `make memtest` for the same reason as the i386
        # GCC job above.
        run: make CC="clang -m32" test

  linux-i386-ubsan:
    name: Linux i386 (UBSan, gcc -m32 and clang -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process puts a limit on a hang here. A queue receive
    # that blocks, or a drain that never completes, simply stops the output.
    # The default ceiling of this job is six hours. The suites that it runs
    # take about twenty minutes of real time on this machine, which is `make
    # test` plus `make memtest`. This timeout therefore leaves several times
    # that much room for a slower hosted runner. It also keeps the cost of a
    # hang small, and it does not hide one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # The GCC step needs no sanitizer package of its own. gcc-multilib
        # brings in the 32-bit UndefinedBehaviorSanitizer runtime through a
        # chain of dependencies: gcc-<ver>-multilib -> lib32gcc-<ver>-dev ->
        # lib32ubsan1. The Clang step also needs gcc-multilib, for the same
        # 32-bit crt objects and libgcc that the plain i386 Clang job uses.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test (EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # Neither half of this combination finds what the pair finds. Whether
        # an expression is well defined can depend on the width of size_t. A
        # shift distance that is in range for 64 bits can be too large for 32.
        # Instrumentation is also what makes a compiler deal with an expression
        # that it would otherwise fold away. A defect can therefore sit between
        # the two, where neither the x86_64 sanitizer job nor the plain i386
        # jobs can see it.
        #
        # -fno-sanitize-recover=undefined is necessary. Without it,
        # UndefinedBehaviorSanitizer writes a report to stderr and continues. A
        # real finding here would then not fail the job, because the process
        # still exits 0.
        #
        # This job uses both compilers, as the two plain i386 jobs also do.
        # Their UndefinedBehaviorSanitizer versions do not check the same set
        # of things, so one can be clean where the other is not.
        #
        # This job has no AddressSanitizer step and no `make memtest`. A 32-bit
        # AddressSanitizer needs a reservation of address space that this
        # runner does not always give. valgrind also cannot run a 32-bit
        # process here without libc6-dbg:i386. This is why the two plain i386
        # jobs leave out memtest as well.
        run: make CC="gcc -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test
      - name: make test (clang -m32, EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # The objects depend on the build identity stamp, and that stamp holds
        # the compiler and its flags. A change of CC here therefore builds the
        # objects again. It does not link the objects of the step before it.
        run: make CC="clang -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test

  linux-aarch64-gcc:
    name: Linux aarch64 (cross-compile + QEMU)
    runs-on: ubuntu-latest
    # qemu-user has a class of deadlock around a guest fork() that depends on
    # timing. A lock that the emulator holds at that instant passes to the
    # child in a locked state. The threads of the child then sleep on a futex,
    # and nothing can unlock it. One member of that class is known: the
    # fd_trans_lock of linux-user itself, at
    # gitlab.com/qemu-project/qemu/-/issues/2846. The qemu-user that this job
    # installs below corrects it. This time limit covers whatever else remains
    # in that class. No timeout inside the process can recover from it, because
    # the itimer that the alarm() safety nets of this suite depend on is stuck
    # in the same deadlock. One such event ran for more than 3 hours with no
    # output before somebody cancelled it. This limit keeps another such event
    # cheap, and it does not let one use runner time in silence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # arm64 is a ports architecture. Its package indices are on
        # ports.ubuntu.com. They are not on the primary and security archive
        # mirrors that the default sources of this runner name. You must limit
        # the default sources to amd64, because they hold no arm64 indices at
        # all. You must also add an arm64 source of its own that names
        # ports.ubuntu.com. Without both steps, `apt-get update` gets a 404 as
        # soon as arm64 becomes a foreign architecture, because it asks the
        # default mirrors for arm64 indices that do not exist.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64 abigail-tools
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # Ubuntu 24.04 ships qemu-user 8.2.2. That version has a linux-user bug
        # that can leave its internal, process-wide fd_trans_lock locked for
        # ever in a forked child. See
        # gitlab.com/qemu-project/qemu/-/issues/2846. Every thread of that
        # child then sleeps on a futex for ever. Here you see that as a test
        # that hangs until its own bounded wait gives up, and that test looks
        # unrelated to fork(). A guest program cannot avoid the trigger by a
        # careful fork. qemu-user runs more than one host thread even when the
        # emulated program has one thread, so any guest fork() is exposed.
        # Measured against the cthreadcomm suite of this repository, 8.2.2
        # fails about one full-suite run in ten, on a different fork() test
        # each time. Version 10.x passes.
        #
        # This step copies the static qemu-user binary out of an official
        # Debian trixie image. It does not install one from apt, because no
        # Ubuntu 24.04 archive holds a corrected build. Nothing else about
        # these jobs changes. The binary is static-pie and needs no libc, so it
        # runs directly on the runner. The cross toolchain, the sysroot and the
        # build flags all stay the same.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # The test and memtest targets of each module hold a plain `./tests`
        # command, with no place to put a prefix. You therefore cannot run an
        # aarch64 binary from CC=aarch64-linux-gnu-gcc through `make test` on
        # this x86_64 runner. The shell would try to run an ARM binary
        # directly, and it would fail at once with "cannot execute binary
        # file". This job builds each module with the existing `build` target
        # instead, which it does not change. It then runs the `./tests` binary
        # of that module through qemu-aarch64. There is no `make memtest` step
        # with valgrind, because valgrind inside qemu-user emulation is not a
        # combination that works reliably.
        run: |
          set -e
          # Several suites fork a child that calls abort() on purpose, to
          # prove that a misuse stops the process. qemu-user writes one guest
          # core dump for each abort into the working directory. There is no
          # reason to keep a core dump from a deliberate abort, and across a
          # full sweep they reach several gigabytes. This job therefore sets
          # the limit to zero and does not leave it at the default of the
          # runner.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the `test` target of this module
            # builds, and runs exactly the binaries that its recipe runs. This
            # job therefore covers the same set as the native jobs. Most
            # modules have one binary. chttpclient, chttpserver and cyaml each
            # have several. A module that gets another binary later appears
            # here with no edit to this workflow, because both lists come from
            # the Makefile and stay in step with it automatically. The
            # build_differential target of cyaml stays out, which is correct,
            # because it is not a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from a match against the Makefile of this
            # module. A recipe that changes shape therefore gives an empty
            # list. The loop below then runs zero times, and the job builds the
            # module but never runs it, with no non-zero status for `set -e` to
            # see. These two tests prove that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC=aarch64-linux-gnu-gcc $targets)
            # This runs from inside the module directory, exactly as the
            # `test` target of that module does. At least one binary, which is
            # tests_spec_suite of cyaml, finds its data files relative to its
            # own directory. That binary fails completely from any other
            # directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

      # Struct layout belongs to one architecture, so no other job can replace
      # this one. The check reads the architecture out of the ELF header of the
      # library and not from the runner, which is x86_64 here. It therefore
      # takes the aarch64 baseline for this cross-built library. Nothing runs
      # under QEMU, because a read of an ELF file and its debug information is
      # a static comparison. The `test` targets of each module above never
      # build the library itself, so the prerequisite of check_abi is what
      # builds it.
      - name: exported ABI matches the committed aarch64 baseline
        run: make CC=aarch64-linux-gnu-gcc check_abi

  linux-aarch64-clang:
    name: Linux aarch64 (Clang cross-compile + QEMU)
    runs-on: ubuntu-latest
    # See the comment in the linux-aarch64-gcc job above for the full reason.
    # This job runs the same fork() tests under the same emulator, so it has
    # the same remaining risk of a deadlock.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # This is the same arm64 ports setup as in the aarch64 GCC job above.
        # See the comment there for the reason. This job also installs clang
        # itself. It keeps gcc-aarch64-linux-gnu, although gcc is not the
        # compiler here, because clang has no crt objects and no libgcc of its
        # own for this target. It links against the ones from
        # gcc-aarch64-linux-gnu.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y clang gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # See the same step in the linux-aarch64-gcc job above for the full
        # reason.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # This has the same shape as the aarch64 GCC job above. It uses a plain
        # ./tests command and has no memtest step. See the comment in that job
        # for the full reason for both. The one real difference is how CC
        # cross-compiles:
        #
        # -B points clang at the crtbeginS.o, libgcc and libgcc_s of
        # gcc-aarch64-linux-gnu. clang has none of its own. The job finds the
        # exact path at run time and does not hold a fixed one, because the
        # path names the GCC version that the gcc-aarch64-linux-gnu package of
        # this runner ships. This workflow must not assume a version.
        # The job does NOT pass an explicit --sysroot=, on purpose. The
        # aarch64-linux-gnu-ld of Debian and Ubuntu already holds the correct
        # sysroot, /usr/aarch64-linux-gnu, from the time somebody built the
        # package. A --sysroot= on top of that puts the prefix in front of
        # every path that ld resolves a second time, and the link then fails.
        # With --sysroot= present, ld reports "cannot find
        # /usr/aarch64-linux-gnu/lib/libc.so.6 inside /usr/aarch64-linux-gnu".
        # Remove the flag and the error goes away.
        run: |
          set -e
          AARCH64_GCC_CROSS_DIR=$(find /usr/lib/gcc-cross/aarch64-linux-gnu -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          # See the same line in the linux-aarch64-gcc job above for the
          # reason.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the `test` target of this module
            # builds, and runs exactly the binaries that its recipe runs. This
            # job therefore covers the same set as the native jobs. Most
            # modules have one binary. chttpclient, chttpserver and cyaml each
            # have several. A module that gets another binary later appears
            # here with no edit to this workflow, because both lists come from
            # the Makefile and stay in step with it automatically. The
            # build_differential target of cyaml stays out, which is correct,
            # because it is not a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from a match against the Makefile of this
            # module. A recipe that changes shape therefore gives an empty
            # list. The loop below then runs zero times, and the job builds the
            # module but never runs it, with no non-zero status for `set -e` to
            # see. These two tests prove that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC="clang --target=aarch64-linux-gnu -B$AARCH64_GCC_CROSS_DIR" $targets)
            # This runs from inside the module directory, exactly as the
            # `test` target of that module does. At least one binary, which is
            # tests_spec_suite of cyaml, finds its data files relative to its
            # own directory. That binary fails completely from any other
            # directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

