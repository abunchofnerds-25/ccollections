name: Coverage

# This workflow runs on every push to main, which is what a merged pull request
# makes, and publishes the merged coverage report to GitHub Pages. A push to
# another branch and a pull request do not start it, on purpose: a full run
# builds and runs every module suite again with gcov instrumentation, and only
# the state of main is worth publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deployment must make an OpenID Connect (OIDC) token, which is
# id-token, and must write the Pages artifact. Nothing here needs write access
# to the contents of the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments compete for the one Pages environment. Unlike in the
# CI workflow, a run that has started is permitted to finish here: if you cancel
# a deployment that is half done, the published site can be left in a state
# where its parts do not agree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Merged coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libssl-dev zlib1g-dev

      - name: Build the merged coverage report
        run: make coverage_site

      - name: Check every file against the coverage threshold
        run: make coverage_check

      - name: Publish the summary to the job page
        run: |
          {
            echo "## Coverage (library sources only)"
            echo
            echo '```'
            cat coverage_site/summary.txt
            echo '```'
            echo
            echo "Merged from every module suite under \`tests/\`, narrowed to \`src/\` and \`include/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: coverage_site/html
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: coverage_site/html

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
