name: Coverage

# Runs on every push to main, which is what a merged pull request makes, and
# publishes the GitHub Pages site: the rendered man pages under man/, which
# the guides under doc/ link to, the merged coverage report under coverage/,
# and a front page. A repository has one Pages site and a deployment replaces
# all of it, so both parts are built here and go out together. Pushes to other
# branches and pull requests don't start it on purpose: a full run builds and
# runs every module suite again under gcov instrumentation, and only the state
# of main is worth publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deployment has to mint an OpenID Connect (OIDC) token, which is
# id-token, and write the Pages artifact. Nothing here needs write access to
# the repository contents.
permissions:
  contents: read
  pages: write
  id-token: write

# Two deployments must never fight over the one Pages environment. Unlike the
# CI workflow, a run that has started is allowed to finish here, because
# cancelling a half-done deployment can leave the published site with parts
# that don't agree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coverage:
    name: Man pages and merged coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y lcov libssl-dev zlib1g-dev mandoc

      # First, because it takes seconds and the coverage build takes most of
      # an hour. It stops on a page that mandoc reports an error in.
      - name: Render the man pages
        run: make man_html

      - name: Build the merged coverage report
        run: make coverage_site

      - name: Check every file against the coverage threshold
        run: make coverage_check

      - name: Publish the summary to the job page
        run: |
          {
            echo "## Coverage (library sources only)"
            echo
            echo '```'
            cat coverage_site/summary.txt
            echo '```'
            echo
            echo "Merged from every module suite under \`tests/\`, narrowed to \`src/\` and \`include/\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: coverage_site/html
          retention-days: 30

      - name: Put the site together
        run: |
          rm -rf pages_site
          mkdir pages_site
          cp -R man_html pages_site/man
          cp -R coverage_site/html pages_site/coverage
          cp ci_scripts/pages_index.html pages_site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages_site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
