  linux-x86_64-memtest-macos-paths:
    name: Linux x86_64 (memtest, macOS code paths)
    runs-on: ubuntu-latest
    # macOS has no valgrind, and leaks(1) there drops the exit status of the
    # test and hangs on a program that forks. The code that only macOS compiles
    # sits behind the _CCOL_EMULATE_DARWIN_* switches, and this job turns them
    # on so that valgrind checks those paths for leaks and memory errors on
    # every push: the condition variable, timed locks and semaphore of common.h
    # (SYNC), the socket setup and the bounded send of csock.h (SOCK), the
    # portable memrchr (MEMRCHR) and the per-thread state that a key owns (TLS).
    # The kqueue wake descriptor (WAKEFD) needs kqueue, so only FreeBSD can run
    # it. The suites take about as long as the memtest of the GCC job.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev valgrind
      - name: make memtest with every macOS switch
        run: >-
          make memtest EXTRA_CFLAGS="-D_CCOL_EMULATE_DARWIN_SYNC=1
          -D_CCOL_EMULATE_DARWIN_SOCK=1 -D_CCOL_EMULATE_DARWIN_MEMRCHR=1
          -D_CCOL_EMULATE_DARWIN_TLS=1"

  linux-i386-gcc:
    name: Linux i386 (GCC, gcc -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libssl-dev:i386 zlib1g-dev:i386 abigail-tools
      - name: make test
        # There's no `make memtest` step here, because valgrind can't run a
        # 32-bit process on this runner without one more 32-bit debug
        # information package, libc6-dbg:i386, which this job doesn't install.
        run: make CC="gcc -m32" test
      # Struct layout belongs to one architecture, so the x86_64 job can't stand
      # in for this one: a member that goes from size_t to unsigned long long,
      # for example, changes nothing on LP64 but moves every later field on
      # ILP32. The check reads the architecture out of the ELF header of the
      # library, so it picks the i386 baseline even though the runner is x86_64.
      # The `test` target goes into the suite directories and never builds the
      # library itself, so here the prerequisite of check_abi is what builds it.
      - name: exported ABI matches the committed i386 baseline
        run: make CC="gcc -m32" check_abi

  linux-i386-clang:
    name: Linux i386 (Clang, clang -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # We need gcc-multilib although gcc isn't the compiler here: clang -m32
        # uses the same 32-bit crt objects and libgcc that the multilib support
        # of a native gcc installation provides, and clang finds them by itself
        # under /usr/lib/gcc/x86_64-linux-gnu/<ver>/32/. So this job needs no -B
        # flag, unlike the aarch64 and arm32 Clang jobs whose targets are
        # cross-compiled; here clang detects the same host gcc installation and
        # just builds for its 32-bit multilib form.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test
        # This job leaves out `make memtest` for the same reason as the i386
        # GCC job above.
        run: make CC="clang -m32" test

  linux-i386-ubsan:
    name: Linux i386 (UBSan, gcc -m32 and clang -m32)
    runs-on: ubuntu-latest
    # Nothing inside the process limits a hang: a queue receive that blocks or a
    # drain that never finishes just stops the output, and the default ceiling
    # of this job is six hours. The suites it runs take about twenty minutes of
    # real time here (`make test` plus `make memtest`), so this timeout leaves
    # several times that for a slower hosted runner while it keeps a hang cheap
    # and doesn't hide it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # The GCC step needs no sanitizer package of its own, since gcc-multilib
        # pulls in the 32-bit UndefinedBehaviorSanitizer runtime through a chain
        # of dependencies: gcc-<ver>-multilib -> lib32gcc-<ver>-dev ->
        # lib32ubsan1. The Clang step needs gcc-multilib too, for the same
        # 32-bit crt objects and libgcc that the plain i386 Clang job uses.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang gcc-multilib libssl-dev:i386 zlib1g-dev:i386
      - name: make test (EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # Neither half of this combination finds what the pair finds. Whether an
        # expression is well defined can depend on the width of size_t (a shift
        # distance that is in range for 64 bits can be too large for 32), and
        # the instrumentation is also what makes a compiler deal with an
        # expression that it would otherwise fold away. So a defect can sit
        # between the two, where neither the x86_64 sanitizer job nor the plain
        # i386 jobs can see it.
        #
        # -fno-sanitize-recover=undefined is needed: without it
        # UndefinedBehaviorSanitizer writes its report to stderr and carries on,
        # the process exits 0 all the same, and a real finding here wouldn't
        # fail the job.
        #
        # Like the two plain i386 jobs, this one uses both compilers, because
        # their UndefinedBehaviorSanitizer versions don't check the same set of
        # things and one can be clean where the other isn't.
        #
        # There's no AddressSanitizer step and no `make memtest`. A 32-bit
        # AddressSanitizer needs a reservation of address space that this runner
        # doesn't always give, and valgrind can't run a 32-bit process here
        # without libc6-dbg:i386, which is also why the two plain i386 jobs
        # leave out memtest.
        run: make CC="gcc -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test
      - name: make test (clang -m32, EXTRA_CFLAGS=-fsanitize=undefined -fno-sanitize-recover=undefined)
        # The objects depend on the build identity stamp, which holds the
        # compiler and its flags, so changing CC here builds the objects again
        # instead of linking the ones from the step before.
        run: make CC="clang -m32" EXTRA_CFLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined" test

  linux-aarch64-gcc:
    name: Linux aarch64 (cross-compile + QEMU)
    runs-on: ubuntu-latest
    # qemu-user has a timing-dependent class of deadlock around a guest fork():
    # a lock that the emulator holds at that instant passes to the child locked,
    # and the child's threads then sleep on a futex, waiting for a lock that
    # nothing can unlock. One member of that class is known, the fd_trans_lock
    # of linux-user itself (gitlab.com/qemu-project/qemu/-/issues/2846), and the
    # qemu-user that this job installs below fixes it. This time limit covers
    # whatever else is left in that class. No timeout inside the process can
    # recover from it, because the itimer that the alarm() safety nets of this
    # suite depend on is stuck in the same deadlock. Such a hang can sit for
    # more than 3 hours with no output until somebody cancels it, and this limit
    # keeps it cheap instead of letting it use runner time in silence.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        # arm64 is a ports architecture: its package indices are on
        # ports.ubuntu.com, not on the primary and security archive mirrors that
        # the default sources of this runner name. The default sources have to
        # be limited to amd64, because they hold no arm64 indices at all, and we
        # also need an arm64 source of its own that names ports.ubuntu.com.
        # Without both, `apt-get update` gets a 404 as soon as arm64 becomes a
        # foreign architecture, since it asks the default mirrors for arm64
        # indices that don't exist.
        run: |
          sudo dpkg --add-architecture arm64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 zlib1g-dev:arm64 abigail-tools
      - name: Install a qemu-user build without the fd_trans_lock fork bug
        # Ubuntu 24.04 ships qemu-user 8.2.2, which has a linux-user bug that
        # can leave its internal, process-wide fd_trans_lock locked for ever in
        # a forked child (gitlab.com/qemu-project/qemu/-/issues/2846). Every
        # thread of that child then sleeps on a futex for ever, which shows up
        # here as a test that hangs until its own bounded wait gives up and that
        # looks unrelated to fork(). A careful fork in the guest doesn't avoid
        # it: qemu-user runs more than one host thread even when the emulated
        # program has one thread, so any guest fork() is exposed. Measured
        # against the cthreadcomm suite of this repository, 8.2.2 fails about
        # one full-suite run in ten, on a different fork() test each time, while
        # version 10.x passes.
        #
        # No Ubuntu 24.04 archive holds a fixed build, so this step copies the
        # static qemu-user binary out of an official Debian trixie image instead
        # of installing one from apt. Nothing else about these jobs changes: the
        # binary is static-pie and needs no libc, so it runs directly on the
        # runner, and the cross toolchain, the sysroot and the build flags all
        # stay the same.
        run: |
          set -e
          STAGE=$(mktemp -d)
          docker run --rm -v "$STAGE:/out" debian:trixie bash -c '
            apt-get update -qq
            apt-get install -y -qq qemu-user-static
            cp /usr/bin/qemu-aarch64-static /out/qemu-aarch64-static
          '
          sudo install -m 0755 "$STAGE/qemu-aarch64-static" /usr/local/bin/qemu-aarch64-static
          sudo rm -rf "$STAGE"
          qemu-aarch64-static --version | head -1
      - name: Cross-build and run each module's test suite under qemu-aarch64
        # The test and memtest targets of each module hold a plain `./tests`
        # command with no place for a prefix, so on this x86_64 runner you can't
        # run an aarch64 binary from CC=aarch64-linux-gnu-gcc through `make
        # test`: the shell would try to run the ARM binary directly and fail at
        # once with "cannot execute binary file". So this job builds each module
        # with the existing `build` target, unchanged, and then runs the
        # `./tests` binary of that module through qemu-aarch64. There's no `make
        # memtest` step with valgrind, because valgrind inside qemu-user
        # emulation doesn't work reliably.
        run: |
          set -e
          # Several suites fork a child that calls abort() on purpose, to prove
          # that a misuse stops the process, and qemu-user writes one guest core
          # dump for each abort into the working directory. A core dump of a
          # deliberate abort tells us nothing and over a full sweep they add up
          # to several gigabytes, so we set the limit to zero instead of keeping
          # the runner's default.
          ulimit -c 0
          for dir in tests/*/; do
            mod=$(basename "$dir")
            [ "$mod" = "tau" ] && continue
            echo "::group::$mod"
            # This builds exactly what the module's `test` target builds and
            # runs exactly the binaries that its recipe runs, so this job covers
            # the same set as the native jobs. Most modules have one binary,
            # while chttpclient, chttpserver and cyaml have several. Both lists
            # come from the Makefile and follow it by themselves, so a module
            # that gets another binary later shows up here with no edit to this
            # workflow. The build_differential target of cyaml stays out, which
            # is right since it isn't a prerequisite of `test`.
            targets=$(sed -n 's/^test:[[:space:]]*//p' "$dir/Makefile" | head -1)
            bins=$(awk '/^test:/{f=1;next} f&&/^\t\.\//{sub(/^\t\.\//,"");print $1;next} f&&/^[^\t]/{exit}' "$dir/Makefile")
            # Both lists come from matching the module's Makefile, so a recipe
            # that changes shape gives an empty list. The loop below would then
            # run zero times and the job would build the module without ever
            # running it, with no non-zero status for `set -e` to see. These two
            # tests make sure that neither list is empty.
            test -n "$targets" || { echo "no test targets parsed from $dir/Makefile" >&2; exit 1; }
            test -n "$bins" || { echo "no test binaries parsed from $dir/Makefile" >&2; exit 1; }
            (cd "$dir" && make CC=aarch64-linux-gnu-gcc $targets)
            # Run from inside the module directory, exactly as the module's
            # `test` target does, because at least one binary (tests_spec_suite
            # of cyaml) finds its data files relative to its own directory and
            # fails completely from any other directory.
            for bin in $bins; do
              echo "--- $bin ---"
              (cd "$dir" && timeout -k 30 1200 qemu-aarch64-static -L /usr/aarch64-linux-gnu "./$bin")
            done
            echo "::endgroup::"
          done

      # Struct layout belongs to one architecture, so no other job can stand in
      # for this one. The check reads the architecture from the ELF header of
      # the library and not from the runner (x86_64 here), so it picks the
      # aarch64 baseline for this cross-built library. Nothing runs under QEMU,
      # because reading an ELF file and its debug information is a static
      # comparison. The `test` targets of each module above never build the
      # library itself, so the prerequisite of check_abi is what builds it.
      - name: exported ABI matches the committed aarch64 baseline
        run: make CC=aarch64-linux-gnu-gcc check_abi

